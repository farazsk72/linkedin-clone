spring.application.name=discover-server

server.port=8761
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# --- Observability (Actuator + Prometheus metrics + Zipkin tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
# Also write to a file so Promtail can ship it to Loki. LOG_DIR resolves to the
# repo-root logs/ dir when run from the module via spring-boot:run.
logging.file.name=${LOG_DIR:../logs}/${spring.application.name}.log