spring.application.name=notification-service

server.port = 9040
server.servlet.context-path=/notifications

# Defaults point at the host Postgres. Same DB_* names the k8s profile uses,
# so both profiles share one vocabulary.
spring.datasource.url=jdbc:postgresql://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME:notificationdb}
spring.datasource.username=${DB_USERNAME:linkedin}
spring.datasource.password=${DB_PASSWORD:linkedin}

spring.jpa.hibernate.ddl-auto=update

# Same secret the gateway and userService sign with. Used only to authenticate
# the STOMP CONNECT frame, whose handshake skips the gateway's auth filter.
jwt.secretKey=${JWT_SECRET_KEY:asdfuasjf9a8s7fd89ihq34kljruyf98ayshcskdhfioafsuyfdcjha890sduf}
# Origin allowed to open the SockJS/WebSocket connection (the frontend dev host).
cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# Register by IP - this host's name resolves to a .mshome.net suffix the
# gateway cannot resolve, so lb:// lookups fail with UnknownHostException.
eureka.instance.prefer-ip-address=true

# --- Observability (Actuator + Prometheus metrics + Zipkin tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
# Also write to a file so Promtail can ship it to Loki.
logging.file.name=${LOG_DIR:../logs}/${spring.application.name}.log