# The k8s manifests expose 8080 (containerPort, probe, Service targetPort),
# so keep that port in-cluster even though local dev runs on 9090.
server.port: 8080

eureka.client:
  register-with-eureka: false
  fetch-registry: false

USER_SERVICE_URI: http://user-service
POSTS_SERVICE_URI: http://posts-service
CONNECTIONS_SERVICE_URI: http://connections-service
NOTIFICATION_SERVICE_URI: http://notification-service

management:
  endpoints:
    web:
      exposure:
        include: "health,info"