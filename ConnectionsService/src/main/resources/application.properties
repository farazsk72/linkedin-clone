spring.application.name=connections-service

server.port = 9030
server.servlet.context-path=/connections

spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=password

eureka.client.service-url.defaultZone= http://localhost:8761/eureka
# Register by IP - this host's name resolves to a .mshome.net suffix the
# gateway cannot resolve, so lb:// lookups fail with UnknownHostException.
eureka.instance.prefer-ip-address=true

# --- Observability (Actuator + Prometheus metrics + Zipkin tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
# Also write to a file so Promtail can ship it to Loki.
logging.file.name=${LOG_DIR:../logs}/${spring.application.name}.log