spring.application.name=posts-service

server.servlet.context-path=/posts
server.port = 9010

# Defaults point at the host Postgres. Same DB_* names the k8s profile uses,
# so both profiles share one vocabulary.
spring.datasource.url=jdbc:postgresql://${DB_SERVER:localhost}:${DB_PORT:5432}/${DB_NAME:postsdb}
spring.datasource.username=${DB_USERNAME:linkedin}
spring.datasource.password=${DB_PASSWORD:linkedin}
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone= http://localhost:8761/eureka
# Register by IP - this host's name resolves to a .mshome.net suffix the
# gateway cannot resolve, so lb:// lookups fail with UnknownHostException.
eureka.instance.prefer-ip-address=true

# --- Observability (Actuator + Prometheus metrics + Zipkin tracing) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging.pattern.level=%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]
# Also write to a file so Promtail can ship it to Loki.
logging.file.name=${LOG_DIR:../logs}/${spring.application.name}.log

# --- Resilience: Feign timeouts + circuit breakers ---
# Bound how long a downstream call can hang before it fails and the breaker
# counts it. Uploads are legitimately slow, so the uploader gets a wider read
# window than the connections read path.
spring.cloud.openfeign.client.config.connections-service.connectTimeout=2000
spring.cloud.openfeign.client.config.connections-service.readTimeout=4000
spring.cloud.openfeign.client.config.uploader-service.connectTimeout=2000
spring.cloud.openfeign.client.config.uploader-service.readTimeout=30000

# Count-based window: open the breaker when half of the last 10 calls fail, or
# when half are "slow" (over the threshold). Stay open 10s, then probe with 3
# half-open calls before closing again.
resilience4j.circuitbreaker.instances.connections.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.connections.sliding-window-size=10
resilience4j.circuitbreaker.instances.connections.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.connections.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.connections.slow-call-duration-threshold=3s
resilience4j.circuitbreaker.instances.connections.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.connections.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.connections.minimum-number-of-calls=5

resilience4j.circuitbreaker.instances.uploader.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.uploader.sliding-window-size=10
resilience4j.circuitbreaker.instances.uploader.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.uploader.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.uploader.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.uploader.minimum-number-of-calls=3

# Expose breaker state through the actuator health endpoint that already runs.
management.health.circuitbreakers.enabled=true

# Instrument Feign with Micrometer so a client call becomes a child span of the
# incoming request and the trace context propagates to the downstream service,
# rather than each Feign hop starting a fresh trace.
spring.cloud.openfeign.micrometer.enabled=true